<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4d7c0f">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muscu Élève">

<title>Musculation · Élève</title>
<style>
@font-face{font-family:"Archivo";src:url(polices/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:"Atkinson";src:url(polices/atkinson-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Atkinson";src:url(polices/atkinson-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--act:#4d7c0f;--act-fonce:#304d09;--act-pale:#eef5e3;
  --sol:#f3f5f8;--craie:#fff;--encre:#1c2128;--repere:#5b6470;--trait:#dde2e8;--sur-encre:#fff;
  --ok:#15803d;--ok-pale:#e7f6ec;--alerte:#b42318;--alerte-pale:#fde8e6;--attention:#b45309;--attention-pale:#fff4e0;
  --d:"Archivo","Arial Narrow",Arial,sans-serif;--t:"Atkinson","Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sol);color:var(--encre);font:18px/1.4 var(--t);-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:96px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:3px solid var(--act);outline-offset:2px}
[hidden]{display:none!important}
.barre{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--craie)}
.barre img{width:38px;height:38px;border-radius:9px;flex:none}
.barre .app{font:700 17px/1.15 var(--t);flex:1;min-width:0}
.barre .app small{display:block;font-weight:400;color:var(--repere);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trace{height:8px;background:var(--act)}
main{padding:12px 16px;max-width:820px;margin:0 auto}
h2{font:800 30px/1.05 var(--d);font-stretch:74%;margin:8px 0 6px}
h3{font:800 23px/1.1 var(--d);font-stretch:78%;margin:0 0 6px}
h4{font:800 18px/1.1 var(--d);font-stretch:80%;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.03em;color:var(--repere)}
p{margin:6px 0}
.muted{color:var(--repere)}.small{font-size:max(15px,var(--fs-min,15px))}
.carte{background:var(--craie);border-radius:16px;padding:14px;margin:12px 0;border:1px solid var(--trait)}
.carte.act{border:2px solid var(--act)}
.carte.info{background:var(--act-pale);border-color:transparent}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:14px;font:700 18px var(--t);border:2px solid var(--encre);background:var(--craie);color:var(--encre);text-decoration:none}
.bt.noir{background:var(--encre);color:var(--sur-encre)}
.bt.act{background:var(--act);border-color:var(--act);color:#fff}
.bt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.bt.mini{min-height:44px;padding:0 12px;font-size:16px}
.bt.danger{border-color:var(--alerte);color:var(--alerte)}
.bt.geant{min-height:96px;font:800 34px/1 var(--d);flex:1}
.bt[disabled]{opacity:.45;cursor:not-allowed}
.lien{background:none;border:0;color:var(--act-fonce);text-decoration:underline;font-weight:700;padding:6px 0;min-height:44px}
.rangee{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pleine{width:100%}
label.ch{display:block;font-weight:700;margin:10px 0 4px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;min-height:52px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--trait);background:var(--craie)}
textarea{min-height:80px}
input.code{font:800 34px/1 var(--d);letter-spacing:.4em;text-align:center}
/* Qui pratique */
.qui{position:sticky;top:0;z-index:5;background:var(--sol);padding:8px 0;margin:0 0 4px;border-bottom:2px solid var(--trait);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qui span{font-weight:700;color:var(--repere);font-size:15px}
.qui button{min-height:48px;padding:0 16px;border-radius:24px;border:2px solid var(--encre);background:var(--craie);font-weight:700}
.qui button.ici{background:var(--encre);color:var(--sur-encre)}
/* Onglets du bas + bouton Mobiles */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--craie);border-top:1px solid var(--trait);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;min-height:64px;border:0;background:none;font:700 14px/1.1 var(--t);color:var(--repere);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav button i{font-style:normal;font-size:22px}
.nav button.ici{color:var(--act-fonce);box-shadow:inset 0 4px 0 var(--act)}
/* Séances */
.puces{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.puces button{flex:none;min-width:52px;min-height:48px;border-radius:12px;border:2px solid var(--trait);background:var(--craie);font:800 18px var(--d)}
.puces button.ici{background:var(--act);border-color:var(--act);color:#fff}
.puces button.fait{border-color:var(--act)}
/* Exercice */
.ex{background:var(--craie);border:1px solid var(--trait);border-radius:16px;padding:12px 14px;margin:10px 0}
.ex.fait{border-left:8px solid var(--ok)}
.ex.alerte{border-left:8px solid var(--attention)}
.ex header{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex header b{font:800 21px/1.1 var(--d);font-stretch:80%}
.prevu{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.prevu span{background:var(--act-pale);border-radius:10px;padding:4px 10px;font-size:max(15px,var(--fs-min,15px))}
.prevu span b{font-family:var(--d)}
.compo{font-size:max(15px,var(--fs-min,15px));color:var(--repere)}
.notes{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:6px 0}
.notes button{min-height:46px;border-radius:10px;border:2px solid transparent;font:800 18px var(--d);color:#1c2128}
.notes button.ici{border-color:var(--encre);transform:scale(1.08)}
/* v2.1 : curseur de ressenti (échelle 1-10) et fiche d'analyse en deux cartes */
.rS{position:relative;padding:0 6px;margin:22px 0 8px}
.rS-bar{height:22px;border-radius:12px;background:linear-gradient(90deg,#e2e8f0 0%,#bfdbfe 22%,#86efac 40%,#fde68a 55%,#fdba74 66%,#fb923c 77%,#f87171 88%,#dc2626 100%)}
.rS input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:56px;background:transparent;position:absolute;left:0;top:-17px;margin:0;cursor:pointer;touch-action:pan-y}
.rS input[type=range]::-webkit-slider-runnable-track{background:transparent;height:56px}
.rS input[type=range]::-moz-range-track{background:transparent}
.rS input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:44px;margin-top:6px;border-radius:50%;background:#fff;border:5px solid #1c2128;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.rS input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:#fff;border:5px solid #1c2128}
.rS.vide input::-webkit-slider-thumb{opacity:0}.rS.vide input::-moz-range-thumb{opacity:0}
.rS-t{display:flex;justify-content:space-between;margin-top:8px;padding:0 6px}
.rS-t span{width:26px;text-align:center;font-weight:800;font-size:15px;color:#64748b}.rS-t span.on{color:#1c2128;font-size:19px}
.rS-l{display:flex;align-items:center;gap:12px;margin-top:12px;padding:10px 12px;border-radius:12px;font-weight:800;background:#e5e7eb;color:#1c2128}
.rS.vide .rS-l{color:#64748b}
.rS-l b{font-size:34px;line-height:1;min-width:44px;text-align:center}.rS-l small{display:block;font-weight:600;opacity:.9;font-size:14px}
.bcm{border-radius:14px;padding:10px 12px;margin:10px 0;border:2px solid var(--trait)}
.bcm h4{margin:0 0 4px;display:flex;gap:8px;align-items:center}
.bcm.moi{background:#f0f9ff;border-color:#7dd3fc}.bcm.coach{background:#fff7ed;border-color:#fdba74}
.bti{font-weight:800;margin:12px 0 4px}
.choix{display:flex;flex-direction:column;gap:6px}
.choix button{min-height:44px;text-align:left;padding:8px 12px;border-radius:12px;border:1.5px solid var(--trait);background:#fff;font-size:16px}
.choix button.ici{background:var(--encre);color:#fff;border-color:var(--encre)}
.vu{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--trait);padding:2px 0}
.vu>span:first-child{font-size:15px;flex:1}.vu .chips{margin:2px 0;flex-wrap:nowrap}
.chips button.ici.rouge{background:var(--alerte);border-color:var(--alerte)}
.rappel{background:#fefce8;border:1.5px solid #fde047;border-radius:12px;padding:6px 10px;margin:8px 0}
.rappel p{margin:4px 0}.okc{color:#15803d}
input.pq{width:100%;margin-top:6px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0}.seg.deux{grid-template-columns:1fr 1fr}
.seg button,.choix2 button{min-height:48px;border-radius:12px;border:1.5px solid var(--trait);background:#fff;font-size:16px;font-weight:700;padding:4px 6px}
.seg button.ici,.choix2 button.ici{background:var(--encre);color:#fff;border-color:var(--encre)}
.seg button.ici.rouge{background:var(--alerte);border-color:var(--alerte)}
.choix2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pas{display:flex;align-items:center;gap:12px;margin:4px 0}.pas button{width:52px;height:48px;border-radius:12px;border:1.5px solid var(--trait);background:#fff;font:800 24px var(--d)}
.pas b{font:800 30px var(--d);min-width:40px;text-align:center}
details.sig{margin:8px 0}details.sig summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.resume{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:6px 0;font-size:16px;color:inherit;min-height:52px}
.resume small{color:var(--repere,#555)}.resume>span:last-child{margin-left:auto}
.resume.coachR{background:#fff7ed;border-radius:12px;padding:6px 10px;margin:8px 0}details.sig summary::-webkit-details-marker{display:none}details.sig[open] summary{color:var(--alerte)}
.rN{font:800 22px/44px var(--d);min-width:44px;height:44px;border-radius:12px;text-align:center;color:#1c2128}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips button{min-height:44px;padding:0 12px;border-radius:22px;border:1.5px solid var(--trait);background:var(--craie);font-size:16px}
.chips button.ici{background:var(--encre);color:#fff;border-color:var(--encre)}
.chips button.stop{border-color:var(--alerte);color:var(--alerte)}
.chips button.stop.ici{background:var(--alerte);color:#fff}
.retour{border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:700}
.retour.ok{background:var(--ok-pale);color:#14532d}
.retour.non{background:var(--attention-pale);color:#7c2d12}
.retour.stop{background:var(--alerte-pale);color:#7f1d1d}
details{margin:6px 0}
summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;gap:6px}
.volet-mots>summary{font-weight:600;font-size:15px;color:var(--repere);list-style:none}
.volet-mots>summary::-webkit-details-marker{display:none}
.volet-mots>summary::before{content:'▶';font-size:11px;transition:transform .2s;display:inline-block}
.volet-mots[open]>summary::before{transform:rotate(90deg)}
.volet-mots>summary .chip-sel{background:var(--encre);color:#fff;border-radius:14px;padding:2px 10px;font-size:14px;font-weight:700}
.volet-mots .chips{margin-top:4px}
/* Test 10 RM */
.ecran{position:fixed;inset:0;z-index:40;background:var(--sol);overflow:auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
.compteur{font:800 120px/1 var(--d);text-align:center;margin:8px 0}
.compteur small{display:block;font:700 18px var(--t);color:var(--repere)}
.charge-grande{font:800 44px/1 var(--d);text-align:center}
.series{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.series span{border-radius:10px;padding:4px 10px;background:var(--craie);border:1px solid var(--trait);font-size:15px}
.series span.ok{background:var(--ok-pale);border-color:var(--ok)}
.chrono{font:800 64px/1 var(--d);text-align:center;color:var(--act-fonce)}
/* Mobiles */
.mob{border:2px solid var(--mc);border-radius:14px;padding:10px 12px;margin:10px 0;background:var(--craie)}
.mob h3{margin:0 0 6px;color:var(--mc)}.mob h3 small{font:700 15px var(--t);color:var(--repere);margin-left:6px}
.mob table{width:100%;border-collapse:collapse;font-size:16px}.mob th,.mob td{border-top:1px solid var(--trait);padding:5px 6px 5px 0;text-align:left;vertical-align:top}.mob th{color:var(--repere);width:42%}
.mob .cap{font-size:15px;color:var(--repere)}
.ech{display:grid;gap:4px}.ech div{display:flex;gap:10px;align-items:center;border-radius:10px;padding:6px 10px;color:#1c2128;font-size:16px}.ech div>b{font:800 22px/1 var(--d);min-width:1.4em;text-align:center}
.tb{width:100%;border-collapse:collapse;font-size:16px}.tb th,.tb td{border-top:1px solid var(--trait);padding:6px 6px 6px 0;text-align:left;vertical-align:top}
.ats{margin:0;padding-left:22px}
.qr{display:flex;justify-content:center;background:#fff;border-radius:14px;padding:10px}
.qr svg{width:min(80vw,360px);height:auto}
.fen{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.55);display:flex;align-items:flex-end;justify-content:center}
.fen>div{background:var(--craie);border-radius:18px 18px 0 0;max-width:820px;width:100%;max-height:92vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.demo-bandeau{background:#fff4e0;border:2px solid #b45309;color:#7c2d12;border-radius:12px;padding:8px 12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:16px}
.mobiles-flottant{position:fixed;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;min-height:52px;border-radius:26px;border:0;background:var(--act-fonce);color:#fff;font:700 17px var(--t);padding:0 18px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.vign-bt{border:0;padding:0;background:none;flex:none;border-radius:10px;margin-right:4px}
.vign-bt .vign{margin:0;width:72px;height:72px}
.poster{width:100%;height:auto;border-radius:10px;border:1px solid var(--trait);display:block;margin:6px 0}
.fiches-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.fiche-vig{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:6px;border:1px solid var(--trait);border-radius:12px;background:#fff;font:inherit;font-size:14px;font-weight:700;text-align:center;color:inherit;cursor:pointer}
.fiche-vig img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:8px}
.ech-liste{display:flex;flex-direction:column;gap:8px}
.ech-it{display:flex;align-items:center;gap:10px;padding:6px;border:1px solid var(--trait);border-radius:12px;background:#fff;font:inherit;text-align:left;color:inherit;cursor:pointer}
.ech-it img{width:84px;height:84px;object-fit:contain;flex:none;background:#fff;border-radius:8px}
.vign-bt:active{transform:scale(.96)}
.fiche-bt{flex:none;margin-right:4px}
.vign{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--trait);flex:none;margin-right:4px}
.ex header{align-items:center}
.illu{display:block;width:100%;max-width:420px;margin:8px auto;background:#fff;border-radius:12px}
.version{font-size:13px;color:var(--repere);border:1px solid var(--trait);border-radius:8px;padding:0 6px}
@media print{.nav,.mobiles-flottant,.qui{display:none}}

/* v2.12 : chrono des séries */
.chrono-bt{margin:8px 0}
html.chrono-ouvert #eps-version,html.chrono-ouvert #eps-conf,html.chrono-ouvert #eps-rappel,html.chrono-ouvert .eps-demo,html.chrono-ouvert #eps-demo,html.chrono-ouvert .epsa-btn{display:none!important}
html.chrono-ouvert body{overflow:hidden}
.chm{position:fixed;inset:0;z-index:80;background:#0f172a;color:#fff;overflow:auto;-webkit-overflow-scrolling:touch}
.chm-in{max-width:640px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px 24px;display:flex;flex-direction:column;gap:10px}
.chm-tete{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:15px}.chm-tete span{color:#cbd5e1;font-size:13px}
.chm-bts{display:flex;gap:6px;flex:none}
.chm-mini{border:1px solid #475569;background:#1e293b;color:#fff;border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;font-weight:700}
.chm-series{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.chm-series span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#334155;font-weight:800}
.chm-series .ok{background:#16a34a}.chm-series .ici{background:#4d7c0f;outline:3px solid #bef264}
.chm-etat{text-align:center;font-weight:800;font-size:20px;margin:4px 0}.chm-etat.serie{color:#bef264}.chm-etat.repos{color:#7dd3fc}.chm-etat.ok{color:#86efac}
.chm-temps{text-align:center;font:800 72px/1 "Archivo",system-ui,sans-serif;font-variant-numeric:tabular-nums}.chm-gros{font-size:120px}
.chm-barre{height:10px;background:#334155;border-radius:6px;overflow:hidden}.chm-barre i{display:block;height:100%;width:0;background:#7dd3fc;transition:width .25s linear}
.chm-img{width:100%;max-height:34vh;object-fit:contain;background:#fff;border-radius:14px}.chm-img.petit{max-height:20vh}
.chm-consigne{text-align:center;color:#e2e8f0;margin:0}
.chm-coach{background:#1e293b;border:1px solid #475569;border-radius:12px;padding:10px 12px}.chm-coach summary{font-weight:800;cursor:pointer}
.chm-coach ul{margin:6px 0;padding-left:18px}.chm-coach li{margin:3px 0}.chm-cle{background:#422006;border-radius:8px;padding:6px 8px;margin:8px 0 4px}
.chm-rangee{display:flex;gap:10px;justify-content:center}
.chm-bt{border:0;border-radius:14px;padding:16px;font:inherit;font-size:18px;font-weight:800;background:#334155;color:#fff;width:100%}.chm-bt.ok{background:#16a34a}

/* v3.0 : échauffement guidé */
.wpart{border:1px solid var(--trait);border-radius:12px;padding:8px;margin:8px 0;background:#fff;display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.wpart.on{border-color:#16a34a;background:#f0fdf4}
.wpart-bt{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;font:inherit;color:inherit;padding:2px;cursor:pointer}
.wpart-c{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid #94a3b8;display:grid;place-items:center;font-weight:800;color:#fff}
.wpart.on .wpart-c{background:#16a34a;border-color:#16a34a}
.wpart-min{border:1px solid var(--trait);background:#f8fafc;border-radius:10px;padding:8px 10px;font:inherit;font-weight:700;font-size:14px}
.wdet{grid-column:1/-1}.wdet summary{cursor:pointer;font-size:14px;font-weight:700;color:#4d7c0f}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.wcard{display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:left;border:2px solid var(--trait);border-radius:12px;background:#fff;padding:6px;font:inherit;font-size:13px;color:inherit;cursor:pointer}
.wcard img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff}
.wcard b{font-size:14px}.wcard span{color:#475569;line-height:1.3}
.wcard.on{border-color:#16a34a;background:#f0fdf4}.wcard.on b::before{content:'✓ ';color:#16a34a}
.wtimer{position:sticky;top:6px;z-index:5;display:flex;gap:10px;align-items:center;justify-content:center;background:#0f172a;color:#fff;border-radius:12px;padding:8px 12px;margin:6px 0}
